    import_map: null

strategy:
  current_focus: "Tres propuestas de acceso a Fulfillment listas para comparar: v1 (tarjeta en la grilla de servicios), v2 (carrusel en panel navy) y v3 (pantalla de Fulfillment con front propio, según Figma 13284:7345). Las tres terminan en el mismo formulario"
  intervention: "greenfield-local"
  recommended_next:
    - "Elegir con el área cuál de las tres versiones se adopta"
    - "Confirmar si la tipografía Poppins de la v3 es definitiva o un borrador del diseño: es la única fuente fuera del sistema actual"
    - "Validar con el área solicitante los textos breves, el orden y el destacado de las tarjetas del carrusel de la v2"
    - "Validar el texto del mensaje de confirmación del formulario"
    - "Optimizar 'banner ff formulario.png' (4,7 MB) antes de cualquier publicación real"
  deferred:
    - "Menú de usuario logueado de la landing (oculto en el DOM sin sesión)"
    - "Scripts de terceros: GTM, Meta Pixel, chat de Wcentrix"
    - "Qué muestra '¿Dónde encuentro mi código de seguimiento?' (en la landing original tampoco abre nada)"
    - "Qué hacer con la imagen del hero de la v3 en mobile: por ahora se oculta"

knowledge:
  confirmed:
    - "La única carpeta con permisos de lecto-escritura es 'Formulario FF claude'"
    - "El HTML guardado en 'html reference' no conserva los estilos: la landing usa MUI + emotion (CSS inyectado por JS) y falta el chunk landing-template-*.js"
    - "Los estilos de la réplica se obtuvieron de los estilos computados de https://micorreo.correoargentino.com.ar/landing (2026-09-10, viewport 1440x900, sesión sin loguear)"
    - "La landing declara Gilroy sin @font-face; el prototipo la embebe desde los .ttf del proyecto de Envío Internacional"
    - "El bundle original de MiCorreo sólo renderiza si se lo sirve en la ruta /landing"
    - "Campos, obligatoriedad y validaciones del formulario salen del documento formal 'Solicitud Inicial_Formulario FF' v1.0. 'Número de cliente' aparece sólo si responde 'Sí' y no es obligatorio"
    - "El listado de rubros es el desplegable real de MiCorreo, provisto por Correo Argentino: no se puede inventar ni editar por cuenta propia (2026-09-11)"
    - "La v2 sólo cambia la landing. El hero se mantiene; 'Gestionar Devolución' y 'Conocé nuestros servicios' pasan a un carrusel de accesos; la devolución abre un modal con todo su contenido; 'Seguimiento de envíos' y 'Sucursales' quedan en su lugar (pedido del usuario, 2026-09-11)"
    - "Rediseño del bloque central de la v2 según imagen de referencia del usuario (2026-09-11): el carrusel conserva el título 'Conocé nuestros servicios' dentro de un panel navy redondeado; la tarjeta lleva el ícono en columna propia a la izquierda y la etiqueta en flujo; 'Accesos directos' pasa a llamarse 'Accesos rápidos' con Sucursales primero, tarjeta blanca y CTA subrayado; los títulos de sección de la v2 van sin reglas laterales"
    - "En la v2 sólo Fulfillment va destacado. La imagen de referencia muestra también 'Mis Comunicaciones Digitales' con '¡Nuevo!' y 'Solicitar'; se decidió no replicarlo porque el requerimiento formal sólo presenta Fulfillment como novedad (2026-09-11)"
    - "El carrusel mantiene las 7 tarjetas: 'limpiar los accesos' se resolvió como rediseño visual, no como recorte (2026-09-11)"
    - "La v1 no se duplica para las propuestas: los componentes compartidos reciben props opcionales con el valor de la landing original por defecto, y la piel propia de cada versión se aísla con un atributo"
    - "La v3 se reformuló por completo el 14/09/2026: se descartó el visor con el flyer estático y pasó a ser un front integrado con pantalla propia de Fulfillment, según el diseño de Figma 13284:7345"
    - "La pantalla de la v3 mantiene la barra de navegación superior y el footer de la landing; todo lo demás es un front propio (navy #14245d y #192b69, Poppins, íconos en círculo)"
    - "En la v3 el formulario va a dos columnas en escritorio y a una sola en responsive, con la misma funcionalidad de las otras versiones, y al enviarse muestra un mensaje de éxito con ícono que conserva la altura de la tarjeta (pedido del usuario, 2026-09-14)"
    - "En la v3 la imagen del hero no se muestra en pantallas de hasta 900px: queda sólo el mensaje"
    - "Hay dos pantallas de Fulfillment: la compartida por la v1 y la v2, y la propia de la v3"
    - "v3: el ancho máximo del contenido se amplió de 1010px (el del diseño) a 1320px (el de la landing), porque a 1010px se veía angosto en pantallas grandes (feedback del usuario, 2026-09-14). Las columnas de servicios e inputs son grillas fijas a 2, así que el cambio sólo las ensancha"
    - "v3: 'Número de cliente' se corrigió para aparecer justo debajo de '¿Ya sos cliente de MiCorreo?' al responder 'Sí', en vez de sumarse arriba al grid de inputs (feedback del usuario, 2026-09-14)"
    - "v3: los encabezados de columna ('¿Qué incluye...' / 'Distribución rápida...') pasaron de 16px a 20px, que es lo que pedía el diseño (feedback del usuario, 2026-09-14)"
  assumptions:
    - "Los assets de marca de Fulfillment (logo e ilustración) de la v1 son provisorios: se dibujaron con la paleta de MiCorreo hasta que el cliente entregue los oficiales"
    - "No se crea una landing institucional paralela; sí una página de Fulfillment dentro de MiCorreo"
    - "v2: los textos breves de las tarjetas se derivaron del copy existente de la landing; no son textos aprobados"
    - "v2: las medidas del rediseño se derivaron de una imagen de referencia y de los tokens existentes, no del archivo de Figma. Conviene contrastarlas al recuperar el acceso"
    - "v2: Fulfillment va tercero en el carrusel, destacado con '¡Nuevo!' y CTA 'Solicitar'"
    - "v3: Poppins puede ser una tipografía de borrador del diseño; es la única fuera del sistema actual y se carga desde Google Fonts"
    - "v3: los seis servicios se modelan agrupados por columna, y no como una lista que se acomoda sola, para que en mobile cada encabezado quede con sus propios servicios"
    - "La cifra 'Más de 3.000 negocios ya confían' del hero de Fulfillment de la v1 está sin validar"
  open_questions:
    - "Cuál de las tres propuestas de acceso a Fulfillment se adopta: v1 (tarjeta en la grilla de servicios), v2 (carrusel en panel navy) o v3 (pantalla con front propio)"
    - "Texto definitivo del mensaje de confirmación del formulario"
    - "Comportamiento ante error de envío, cuando exista backend"

