architecture:
  mode: monorepo-single-build
  build_root: "."
  hub_route: "/"
  deep_linking: required
  module_style_isolation: required
  notes: "Build único en la raíz, puerto 4320. El Hub es la home y cada módulo cuelga de una ruta interna. Ámbitos de estilo aislados: tokens.css (:root), shell.tokens.css ([data-shell]), prototype.tokens.css ([data-module='prototype']) y fulfillment.tokens.css ([data-page='fulfillment-v3'])."
  routes:
    - path: "/"
      module: hub
    - path: "/prototipo"
      module: prototype
    - path: "/prototipo/v3"
      module: prototype
      note: "La landing replicada, con el acceso a Fulfillment"
    - path: "/prototipo/v3/fulfillment"
      module: prototype
      note: "Pantalla con front propio. El hash #formulario baja al formulario"
    - path: "/documentacion"
      module: documentation
    - path: "/documentacion/:docId"
      module: documentation
    - path: "*"
      module: hub
      note: "Catch-all: las rutas de la v1 y la v2, retiradas el 2026-09-14, vuelven al Hub en vez de dar error"

documentation:
  source_mode: source-documents
  module_path: "documentation"
  canonical_source: "documentation/00-INDICE.md"
  external_sources:
    - "contexto_inicial_formulario_fulfillment.md"
    - "Solicitud Inicial_Formulario FF_10092026.docx"
  change_log: "documentation/05-REGISTRO-DE-CAMBIOS.md"

frontend:
  source_mode: from-scratch
  scratch_input: "html reference + estilos computados de la landing en producción; Figma para las pantallas de Fulfillment"
  module_path: "src/modules/prototype"
  canonical_source: "src/modules/prototype"
  external_sources:
    - "Envio internacional CLAUDE (tokens y fuentes)"
    - "Ninguna: desde el 2026-09-14 el proyecto no depende de recursos externos (se retiró Google Fonts al descartar Poppins)"
  change_log: "documentation/05-REGISTRO-DE-CAMBIOS.md"
  responsive:
    status: replicated
    breakpoint: "900px (md de MUI); el original tiene además un escalón en 600px que la réplica no hace. La pantalla de Fulfillment suma uno en 560px"
    navigation_strategy: "Hamburguesa con panel desplegable bajo el header, como el original"
    wide_table_strategy: not-applicable

capabilities:
  prototype: "implementación directa con Vite + React + TypeScript + CSS Modules"
  documentation: "Markdown en documentation/"
  figma-sync: "plugin de Figma (get_design_context / use_figma)"
  presentation: "skill presentacion-proyecto (deck HTML autocontenido, capturas estáticas del prototipo real)"

