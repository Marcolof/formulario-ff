    path: "src/modules/prototype"
    children:
      - name: "Versión 1 — layout original + Fulfillment"
        route: "/prototipo/v1"
        path: "src/modules/prototype/v1"
        status: review
      - name: "Página Fulfillment con formulario (v1 y v2)"
        route: "/prototipo/v1/fulfillment"
        path: "src/modules/prototype/v1/fulfillment"
        status: review
        note: "También se monta en /prototipo/v2/fulfillment. Assets de marca provisorios; mensaje de confirmación pendiente de validación."
      - name: "Versión 2 — carrusel de servicios"
        route: "/prototipo/v2"
        path: "src/modules/prototype/v2"
        status: draft
        note: "Compone la landing con componentes de la v1 (props opcionales, sin duplicarlos); agrega el carrusel en panel navy y el modal de devolución."
      - name: "Versión 3 — landing con acceso redirigido"
        route: "/prototipo/v3"
        path: "src/modules/prototype/v3"
        status: draft
        note: "La landing de la v1 sin cambios visuales; sólo cambia el destino del acceso a Fulfillment."
      - name: "Pantalla Fulfillment de la v3"
        route: "/prototipo/v3/fulfillment"
        path: "src/modules/prototype/v3/fulfillment"
        status: draft
        note: "Front propio según Figma 13284:7345, con su capa de tokens. Reutiliza navbar, footer, inputs, botón y las reglas del formulario. Poppins y el ancho de 1010px pendientes de confirmar."
    extraction:
      required: true
      status: partial
      entrypoints:
        - "src/modules/prototype/v1/LandingPage.tsx"
        - "src/modules/prototype/v2/LandingPage.tsx"
        - "src/modules/prototype/v3/LandingPage.tsx"
        - "src/modules/prototype/v1/fulfillment/FulfillmentPage.tsx"
        - "src/modules/prototype/v3/fulfillment/FulfillmentPage.tsx"
      standalone_command: "npm run dev"
      shared_dependencies:
        - "src/styles/tokens.css"
        - "src/styles/globals.css"
        - "src/modules/prototype/prototype.tokens.css"
        - "Poppins desde Google Fonts, declarada en index.html (sólo la pantalla de la v3)"
      internal_dependencies:
        - "La v2 importa componentes y datos de la v1: extraer la v2 implica llevar también v1/components, v1/data y v1/fulfillment"
        - "La v3 importa los componentes de la landing de la v1 y, en su pantalla propia, el navbar, el footer, los controles de formulario y useContactForm"
      adapters: []
      pending:
        - "Sin index.ts público ni MODULE.md: el router importa las páginas directamente"
        - "La vuelta al Hub está fija en PrototypeChrome, no se recibe por configuración"
      module_guide: "documentation/04-REPLICA-LANDING.md"
  presentation:
    status: absent
    route: null
    path: "presentation"
    children: []

