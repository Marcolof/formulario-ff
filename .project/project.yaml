project:
  name: "FORMULARIO FF"
  client: "Correo Argentino"
  scenario: "Nueva página de Fulfillment con formulario de contacto dentro del ecosistema MiCorreo, más mejoras parciales de la landing"
  local_root: "."

origin:
  mode: local-folder
  external_repository:
    url: null
    ref: null
    access: read-only
    classification: null
    imported_at: null
    local_snapshot: null
    source_manifest: null
    import_map: null

strategy:
  current_focus: "Tres propuestas de acceso a Fulfillment listas para comparar: v1 (tarjeta en la grilla de servicios + página con formulario), v2 (carrusel en panel navy) y v3 (landing igual a la v1 y flyer del cliente en un visor, sin formulario)"
  intervention: "greenfield-local"
  recommended_next:
    - "Elegir con el área cuál de las tres versiones se adopta; la v3 no capta contactos, así que no cumple sola el objetivo del requerimiento formal"
    - "Validar con el área solicitante los textos breves, el orden y el destacado de las tarjetas del carrusel de la v2"
    - "Validar el texto del mensaje de confirmación del formulario"
    - "Llevar v2 o v3 a Figma si se quiere documentar el diseño; el conector de Figma requiere volver a autenticarse"
  deferred:
    - "Menú de usuario logueado de la landing (oculto en el DOM sin sesión)"
    - "Scripts de terceros: GTM, Meta Pixel, chat de Wcentrix"
    - "Qué muestra '¿Dónde encuentro mi código de seguimiento?' (en la landing original tampoco abre nada)"

knowledge:
  confirmed:
    - "La única carpeta con permisos de lecto-escritura es 'Formulario FF claude'"
    - "El HTML guardado en 'html reference' no conserva los estilos: la landing usa MUI + emotion (CSS inyectado por JS) y falta el chunk landing-template-*.js"
    - "Los estilos de la réplica se obtuvieron de los estilos computados de https://micorreo.correoargentino.com.ar/landing (2026-09-10, viewport 1440x900, sesión sin loguear)"
    - "La landing declara Gilroy sin @font-face; el prototipo la embebe desde los .ttf del proyecto de Envío Internacional"
    - "El bundle original de MiCorreo sólo renderiza si se lo sirve en la ruta /landing"
    - "Campos, obligatoriedad y validaciones del formulario salen del documento formal 'Solicitud Inicial_Formulario FF' v1.0. 'Número de cliente' aparece sólo si responde 'Sí' y no es obligatorio"
    - "El listado de rubros es el desplegable real de MiCorreo, provisto por Correo Argentino: no se puede inventar ni editar por cuenta propia (2026-09-11)"
    - "La v2 sólo cambia la landing. El hero se mantiene; 'Gestionar Devolución' y 'Conocé nuestros servicios' pasan a un carrusel de accesos con tarjetas de título, descripción breve, CTA e ícono; la devolución abre un modal con todo su contenido; 'Seguimiento de envíos' y 'Sucursales' quedan en su lugar (pedido del usuario, 2026-09-11)"
    - "Hay una sola página de Fulfillment para las dos versiones que la usan (v1 y v2)"
    - "Rediseño del bloque central de la v2 según imagen de referencia del usuario (2026-09-11): el carrusel conserva el título 'Conocé nuestros servicios' dentro de un panel navy redondeado; la tarjeta lleva el ícono en columna propia a la izquierda y la etiqueta en flujo; 'Accesos directos' pasa a llamarse 'Accesos rápidos' con Sucursales primero, tarjeta blanca y CTA subrayado; los títulos de sección de la v2 van sin reglas laterales"
    - "En la v2 sólo Fulfillment va destacado. La imagen de referencia muestra también 'Mis Comunicaciones Digitales' con '¡Nuevo!' y 'Solicitar'; se decidió no replicarlo porque el requerimiento formal sólo presenta Fulfillment como novedad (2026-09-11)"
    - "El carrusel mantiene las 7 tarjetas: 'limpiar los accesos' se resolvió como rediseño visual, no como recorte (2026-09-11)"
    - "La v1 no se duplica para las propuestas: los componentes compartidos reciben props opcionales con el valor de la landing original por defecto, y la piel propia de cada versión se aísla con un data-variant"
    - "La v3 tiene la landing idéntica a la v1 y el CTA de Fulfillment abre una imagen estática en un visor a alto de pantalla, con cerrar flotante arriba a la derecha, zoom con rueda, pinch de trackpad y gestos típicos también en responsive (pedido del usuario, 2026-09-14)"
    - "La v3 no tiene pantalla propia de Fulfillment ni formulario: el acceso muestra sólo el flyer"
  assumptions:
    - "Los assets de marca de Fulfillment (logo e ilustración) son provisorios: se dibujaron con la paleta de MiCorreo hasta que el cliente entregue los oficiales"
    - "No se crea una landing institucional paralela; sí una página de Fulfillment dentro de MiCorreo"
    - "v2: los textos breves de las tarjetas se derivaron del copy existente de la landing; no son textos aprobados"
    - "v2: las medidas del rediseño (padding del panel, tamaño de ícono y de etiqueta) se derivaron de la imagen de referencia y de los tokens existentes, no del archivo de Figma, porque la cuenta actual no tiene acceso a él. Conviene contrastarlas al recuperar el acceso"
    - "v2: Fulfillment va tercero en el carrusel, destacado con '¡Nuevo!' y CTA 'Solicitar', como en el wireframe"
    - "v3: los valores del visor (250% en el doble toque, 600% de máximo, paso de los botones, oscurecido del fondo con el token del login) son criterio de diseño, no una definición del área"
    - "v3: el flyer se toma como definitivo para prototipar, pero dice 'Próximamente' y tiene un error de tipeo ('Gestión depedidos'), así que probablemente sea una versión de trabajo"
    - "La cifra 'Más de 3.000 negocios ya confían' del hero de Fulfillment está sin validar"
  open_questions:
    - "Cuál de las tres propuestas de acceso a Fulfillment se adopta: v1 (tarjeta en la grilla de servicios), v2 (carrusel en panel navy) o v3 (flyer en visor)"
    - "Si Fulfillment se comunica sólo como pieza informativa o si tiene que captar contactos: la v3 no tiene formulario"
    - "Texto definitivo del mensaje de confirmación del formulario"
    - "Comportamiento ante error de envío, cuando exista backend"

