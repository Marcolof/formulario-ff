delivery:
  local_first: true
  local_status: verified
  repository: "https://github.com/Marcolof/formulario-ff"
  repository_status: connected
  remote_repository_creation: user-only
  local_git_init: done
  remote_connection: user-provided-url-only
  push_policy: explicit
  branch: main
  vercel_project: "formulario-ff (marcos-projects-c934fa75)"
  public_url: "https://formulario-ff.vercel.app"
  status: deployed
  last_verified: "2026-09-14"
  pending_push: "Ajustes posteriores a 17ae77a: imagen del hero con object-fit: cover; nuevo orden de los campos (rubro donde estaba el teléfono); color de foco de inputs y selects con --border-focus; texto debajo de 'Enviar'; retiro de las versiones v1 y v2 con todo lo que arrastra (rutas, documento 08-PROPUESTA-V2.md, tokens --ff- sin uso, documentación reescrita); menú del prototipo con panel de casos de uso; nuevos límites de longitud del formulario. Pendiente de decidir: el asset 'banner ff formulario.png' cambió en disco (4,7 MB → 5,4 MB) fuera de esta sesión, sin confirmar si es intencional — no está incluido en el commit hasta que el usuario lo confirme."
