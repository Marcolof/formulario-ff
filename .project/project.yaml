architecture:
  mode: monorepo-single-build
  build_root: "."
  hub_route: "/"
  deep_linking: required
  module_style_isolation: required
  notes: "Build único en la raíz, puerto 4320. El Hub es la home y cada módulo cuelga de una ruta interna. Tres ámbitos de estilo aislados: tokens.css (:root), shell.tokens.css ([data-shell]) y prototype.tokens.css ([data-module='prototype'])."
  routes:
    - path: "/"
      module: hub
    - path: "/prototipo"
      module: prototype
    - path: "/prototipo/v1"
      module: prototype
    - path: "/prototipo/v1/fulfillment"
      module: prototype
    - path: "/prototipo/v2"
      module: prototype
      note: "El hash #gestion-devolucion abre el modal de devolución"
    - path: "/prototipo/v2/fulfillment"
      module: prototype
      note: "Mismo componente que /prototipo/v1/fulfillment"
    - path: "/prototipo/v3"
      module: prototype
      note: "El hash #fulfillment abre el visor con el flyer. No hay /prototipo/v3/fulfillment: en esta propuesta Fulfillment no tiene pantalla propia"
    - path: "/documentacion"
      module: documentation
    - path: "/documentacion/:docId"
      module: documentation

documentation:
  source_mode: source-documents
  module_path: "documentation"
  canonical_source: "documentation/00-INDICE.md"
  external_sources:
    - "contexto_inicial_formulario_fulfillment.md"
    - "Solicitud Inicial_Formulario FF_10092026.docx"
  change_log: "documentation/05-REGISTRO-DE-CAMBIOS.md"

frontend:
  source_mode: from-scratch
  scratch_input: "html reference + estilos computados de la landing en producción"
  module_path: "src/modules/prototype"
  canonical_source: "src/modules/prototype"
  external_sources:
    - "Envio internacional CLAUDE (tokens y fuentes)"
  change_log: "documentation/05-REGISTRO-DE-CAMBIOS.md"
  responsive:
    status: replicated
    breakpoint: "900px (md de MUI); el original tiene además un escalón en 600px que la v1 no replica. El carrusel de la v2 suma un escalón en 1200px (4 → 3 tarjetas)"
    navigation_strategy: "Hamburguesa con panel desplegable bajo el header, como el original"
    wide_table_strategy: not-applicable

capabilities:
  prototype: "implementación directa con Vite + React + TypeScript + CSS Modules"
  documentation: "Markdown en documentation/"
  figma-sync: "plugin de Figma (use_figma / get_design_context); hoy requiere volver a autenticar el conector"

modules:
  hub:
    status: approved
    route: "/"
    path: "src/modules/hub"
    children: []
    notes: "Sólo muestra tarjetas de módulos con landing real; presentation no aparece."
  documentation:
    status: approved
    route: "/documentacion"
    path: "src/modules/documentation"
    canonical_content: "documentation/"
    children:
      - name: "Contexto"
        route: "/documentacion/contexto"
        path: "documentation/01-CONTEXTO.md"
        status: approved
      - name: "Fuentes"
        route: "/documentacion/fuentes"
        path: "documentation/02-FUENTES.md"
        status: approved
      - name: "Color y tokens"
        route: "/documentacion/color-y-tokens"
        path: "documentation/03-COLOR-Y-TOKENS.md"
        status: approved
      - name: "Réplica de la landing"
        route: "/documentacion/replica-landing"
        path: "documentation/04-REPLICA-LANDING.md"
        status: approved
      - name: "Registro de cambios"
        route: "/documentacion/registro-de-cambios"
        path: "documentation/05-REGISTRO-DE-CAMBIOS.md"
        status: approved
      - name: "Arquitectura y rutas"
        route: "/documentacion/arquitectura-y-rutas"
        path: "documentation/06-ARQUITECTURA-Y-RUTAS.md"
        status: approved
      - name: "Formulario Fulfillment"
        route: "/documentacion/formulario-fulfillment"
        path: "documentation/07-FORMULARIO-FULFILLMENT.md"
        status: review
      - name: "Versión 2 — Carrusel de servicios"
        route: "/documentacion/propuesta-v2"
        path: "documentation/08-PROPUESTA-V2.md"
        status: draft
      - name: "Versión 3 — Flyer en visor"
        route: "/documentacion/propuesta-v3"
        path: "documentation/09-PROPUESTA-V3.md"
        status: draft
  prototype:
    status: review
    fidelity: high
    route: "/prototipo"
    path: "src/modules/prototype"
    children:
      - name: "Versión 1 — layout original + Fulfillment"
        route: "/prototipo/v1"
        path: "src/modules/prototype/v1"
        status: review
      - name: "Página Fulfillment con formulario de contacto"
        route: "/prototipo/v1/fulfillment"
        path: "src/modules/prototype/v1/fulfillment"
        status: review
        note: "Página de Fulfillment de las versiones 1 y 2: también se monta en /prototipo/v2/fulfillment. La v3 no la usa. Assets de marca provisorios; mensaje de confirmación pendiente de validación."
      - name: "Versión 2 — carrusel de servicios"
        route: "/prototipo/v2"
        path: "src/modules/prototype/v2"
        status: draft
        note: "Compone la landing con componentes de la v1 (que reciben props opcionales, sin duplicarlos); agrega el carrusel en panel navy y el modal de devolución. Textos breves y orden pendientes de validación; medidas pendientes de contrastar contra Figma."
      - name: "Versión 3 — flyer en visor"
        route: "/prototipo/v3"
        path: "src/modules/prototype/v3"
        status: draft
        note: "La landing de la v1 sin cambios visuales; el CTA de Fulfillment abre el flyer del cliente en un visor con zoom y gestos, sin dependencias nuevas. No incluye formulario, así que sola no cumple el objetivo del requerimiento."
    extraction:
      required: true
      status: partial
      entrypoints:
        - "src/modules/prototype/v1/LandingPage.tsx"
        - "src/modules/prototype/v2/LandingPage.tsx"
        - "src/modules/prototype/v3/LandingPage.tsx"
        - "src/modules/prototype/v1/fulfillment/FulfillmentPage.tsx"
      standalone_command: "npm run dev"
      shared_dependencies:
        - "src/styles/tokens.css"
        - "src/styles/globals.css"
        - "src/modules/prototype/prototype.tokens.css"
      internal_dependencies:
        - "La v2 importa componentes y datos de la v1: extraer la v2 implica llevar también v1/components, v1/data y v1/fulfillment"
        - "La v3 importa todos los componentes de la landing de la v1: extraerla implica llevar v1/components y v1/data"
      adapters: []
      pending:
        - "Sin index.ts público ni MODULE.md: el router importa las páginas directamente"
        - "La vuelta al Hub está fija en PrototypeChrome, no se recibe por configuración"
      module_guide: "documentation/04-REPLICA-LANDING.md"
  presentation:
    status: absent
    route: null
    path: "presentation"
    children: []

