schema_version: "0.3.1"
last_updated: "2026-09-14"

project:
  name: "FORMULARIO FF"
  client: "Correo Argentino"
  scenario: "Nueva página de Fulfillment con formulario de contacto dentro del ecosistema MiCorreo, más mejoras parciales de la landing"
  local_root: "."

origin:
  mode: local-folder
  external_repository:
    url: null
    ref: null
    access: read-only
    classification: null
    imported_at: null
    local_snapshot: null
    source_manifest: null
    import_map: null

strategy:
  current_focus: "Una sola propuesta vigente, la v3: la landing replicada con el acceso a una pantalla de Fulfillment de front propio (Figma 13284:7345) que termina en el formulario. Las versiones v1 y v2 se retiraron el 2026-09-14 a pedido del usuario, con copia de seguridad previa"
  intervention: "greenfield-local"
  recommended_next:
    - "Validar el texto del mensaje de confirmación del formulario"
    - "Optimizar 'banner ff formulario.png' (5,4 MB, versión confirmada por el usuario el 2026-09-14) antes de cualquier publicación real"
    - "Decidir si la maqueta debe reflejar la URL final /FF (hoy la pantalla vive en /prototipo/v3/fulfillment por la estructura de módulos)"
    - "Validar con el usuario el guion y las capturas del deck de presentación (public/presentacion/presentacion.html), primera versión sin revisar"
    - "Las capturas del deck (public/presentacion/assets/screens/, 888 KB en dos archivos) están sin optimizar; conviene comprimirlas si el deck se comparte fuera de este entorno"
  deferred:
    - "Menú de usuario logueado de la landing (oculto en el DOM sin sesión)"
    - "Scripts de terceros: GTM, Meta Pixel, chat de Wcentrix"
    - "Qué muestra '¿Dónde encuentro mi código de seguimiento?' (en la landing original tampoco abre nada)"
    - "Qué hacer con la imagen del hero de la v3 en mobile: por ahora se oculta"
    - "Google reCAPTCHA: el documento de Propuesta v1.2 lo pide y forma parte del requerimiento — NO está descartado ni postergado. Simplemente no es tema de UX: lo resuelve desarrollo. Este proyecto no lo diseña, no lo documenta y no lo agrega al prototipo (2026-09-14). Mismo criterio que los scripts de terceros de la landing"

knowledge:
  confirmed:
    - "La única carpeta con permisos de lecto-escritura es 'Formulario FF claude'"
    - "El HTML guardado en 'html reference' no conserva los estilos: la landing usa MUI + emotion (CSS inyectado por JS) y falta el chunk landing-template-*.js"
    - "Los estilos de la réplica se obtuvieron de los estilos computados de https://micorreo.correoargentino.com.ar/landing (2026-09-10, viewport 1440x900, sesión sin loguear)"
    - "La landing declara Gilroy sin @font-face; el prototipo la embebe desde los .ttf del proyecto de Envío Internacional"
    - "El bundle original de MiCorreo sólo renderiza si se lo sirve en la ruta /landing"
    - "Campos, obligatoriedad, formatos y longitudes del formulario salen del documento 'Propuesta Inicial_Formulario FF' v1.2 (14/09/2026), punto 3 — VERIFICADO contra la fuente el 2026-09-14. El de 'Solicitud Inicial' v1.0 NO contiene esas reglas: sólo la lista de campos. 'Número de cliente' aparece sólo si responde 'Sí'; él y Razón Social son los dos únicos campos no obligatorios"
    - "El listado de rubros es el desplegable real de MiCorreo, provisto por Correo Argentino: no se puede inventar ni editar por cuenta propia (2026-09-11)"
    - "Las versiones v1 (layout original con el formulario en una columna) y v2 (carrusel de servicios en panel navy) se borraron el 2026-09-14 a pedido del usuario, que ya tenía copia de seguridad. Lo que la v3 usaba se movió con git mv a v3/ (components, data, useContactForm, LandingPage.module.css); el resto se eliminó junto con sus rutas y el documento 08-PROPUESTA-V2.md"
    - "La réplica de la landing no se duplica para las propuestas: los componentes compartidos reciben props opcionales con el valor de la landing original por defecto, y la piel propia de cada variante se aísla con un atributo"
    - "La v3 se reformuló por completo el 14/09/2026: se descartó el visor con el flyer estático y pasó a ser un front integrado con pantalla propia de Fulfillment, según el diseño de Figma 13284:7345"
    - "La pantalla de la v3 mantiene la barra de navegación superior y el footer de la landing; todo lo demás es un front propio (navy #14245d y #192b69, íconos en círculo). La tipografía es Gilroy, la del sistema"
    - "En la v3 el formulario va a dos columnas en escritorio y a una sola en responsive, y al enviarse muestra un mensaje de éxito con ícono que conserva la altura de la tarjeta (pedido del usuario, 2026-09-14)"
    - "En la v3 la imagen del hero no se muestra en pantallas de hasta 900px: queda sólo el mensaje"
    - "Hay una sola pantalla de Fulfillment: la de la v3, con front propio"
    - "El botón flotante del prototipo es un menú con dos caminos: 'Volver al hub' y 'Simular casos de uso', que abre un panel de tweaks con chips. Casos: happy path (envío real) y error de formulario (el envío nunca prospera y el mensaje general aparece después de pulsar Enviar). El caso viaja por contexto (components/simulation.ts) y no cambia ninguna regla de validación (pedido del usuario, 2026-09-14)"
    - "LÍMITES DE LONGITUD RESUELTOS (2026-09-14): son los del documento de Propuesta v1.2 — razón social hasta 40, nombre y apellido hasta 60, número de cliente hasta 10 dígitos (tope, no largo exacto) y mail SIN tope, sólo validación de formato. Estuvieron unas horas en 64/64/64 y 10 exactos por un pedido del usuario; al verificar contra la fuente se confirmó que la contradecían y el usuario resolvió dejar lo que dice el documento. El formulario ya no se aparta del documento en ningún punto"
    - "v3: el ancho máximo del contenido se amplió de 1010px (el del diseño) a 1320px (el de la landing), porque a 1010px se veía angosto en pantallas grandes (feedback del usuario, 2026-09-14). Las columnas de servicios e inputs son grillas fijas a 2, así que el cambio sólo las ensancha"
    - "v3: 'Número de cliente' se corrigió para aparecer justo debajo de '¿Ya sos cliente de MiCorreo?' al responder 'Sí', en vez de sumarse arriba al grid de inputs (feedback del usuario, 2026-09-14)"
    - "v3: los encabezados de columna ('¿Qué incluye...' / 'Distribución rápida...') pasaron de 16px a 20px, que es lo que pedía el diseño (feedback del usuario, 2026-09-14)"
    - "v3: la imagen del hero pasó de un width en porcentaje fijo (146% → 124%) a object-fit: cover (feedback del usuario, 2026-09-14, dos rondas). Un tercer pedido de bajar otro 15% (a 105%) reveló que por debajo de ~114% la imagen deja de cubrir el alto de la caja y aparecen huecos; además el porcentaje fijo sólo era seguro para el ancho de viewport probado. object-fit: cover resuelve las dos cosas sin porcentajes calculados a mano"
    - "Se activó el botón terciario del sistema (--button-tertiary-* en tokens.css, ya definido pero sin uso) para los CTA de texto tipo 'Conocer más'/'Ingresá': subrayado inferior amarillo, agregado a Button.module.css como .tertiary y aplicado con composes desde ServicesSection y ShortcutsSection (feedback del usuario, 2026-09-14)"
    - "Ese cambio alcanza también a la landing replicada: sus CTA de texto no tenían subrayado y coincidían así con la landing real. Es una decisión de diseño del usuario, no una corrección de fidelidad — la réplica deja de calcar ese detalle de producción. Ver documentation/04-REPLICA-LANDING.md#diferencias-conocidas"
    - "El texto de confirmación del formulario ('...un asesor comercial se va a comunicar...') ya no menciona 'de Correo Argentino' (fulfillment.content.ts, feedback del usuario, 2026-09-14)"
    - "En la pantalla de Fulfillment de la v3, el cambio de los campos al estado de éxito —y la vuelta con 'Cargar otra consulta'— es una transición en dos pasos en cada sentido (salida animada, luego entrada animada), no un reemplazo directo (feedback del usuario, 2026-09-14, en dos pedidos seguidos). Bug encontrado y corregido en el camino: un useEffect con [sent, phase] como dependencias se autocancelaba el timer al cambiar de fase; se corrigió dejando sólo [sent] para la ida, y la vuelta usa su propio timer en el handler del botón"
    - "El orden de los campos del formulario cambió: 'Rubro de la empresa' pasa a ir donde estaba el teléfono, y el teléfono baja a donde estaba el rubro (feedback del usuario, 2026-09-14). Sólo cambió el orden en el JSX; las reglas y validaciones siguen en useContactForm, sin tocar"
    - "El color de foco de todos los inputs y selects (OutlinedField/OutlinedSelect, las dos variantes) pasó de --color-accent a --border-focus (#2196f3), el token de foco del sistema que ya existía en tokens.css sin usarse (feedback del usuario, con referencia del Design System, 2026-09-14). Alcanza a todo el sistema"
    - "El texto debajo del botón 'Enviar' (form.disclaimer) cambió de 'Tus datos están protegidos.' a 'La información ingresada será almacenada únicamente para gestionar tu solicitud y poder contactarte.' (feedback del usuario, 2026-09-14). Dato compartido en fulfillment.content.ts. Después se agrandó de 11px a 14px (.disclaimer en FulfillmentForm.module.css, feedback del usuario, 2026-09-14)"
    - "En la pantalla de Fulfillment de la v3, cada sección menos el hero aparece con un fundido hacia arriba la primera vez que entra en pantalla, con un hook propio (useReveal.ts, IntersectionObserver, sin librerías). El hero se ve completo desde el arranque (feedback del usuario, 2026-09-14)"
    - "Se agregó el módulo Presentación al Hub (2026-09-14), primer pedido del usuario tras releer el estado del proyecto. El deck (public/presentacion/presentacion.html) es un HTML autocontenido con capturas reales del prototipo, generado con la skill presentacion-proyecto y servido como archivo estático bajo la misma URL y el mismo build — no es una ruta de React"
    - "Al armar el módulo Presentación se encontró y corrigió un bloque fijo en HubPage.tsx ('Todavía sin contenido — Presentación') que ya no era cierto una vez agregado el módulo: no era un dato derivado, sino texto hardcodeado (2026-09-14)"
    - "ALCANCE DEL DECK (pedido del usuario, 2026-09-14): la presentación habla únicamente del requerimiento y de cómo se ven las propuestas finales. El Hub, las landings de módulo y la documentación son el andamiaje de la maqueta con la que se muestra el trabajo al cliente y al equipo — NO son tema de la presentación. Se eliminaron los seis slides que los mostraban y el deck pasó de 16 a 10 slides"
    - "REQUERIMIENTO v1.2 (14/09/2026), leído el 2026-09-14: la página de Fulfillment es una landing INDEPENDIENTE con URL pública propia, micorreo.correoargentino.com.ar/FF, preparada para parámetros UTM y desacoplada del dominio de usuarios de MiCorreo. Debe servir para tráfico de Google Ads, redes, banners del sitio institucional y Email Marketing. Esto resuelve la ambigüedad que la documentación arrastraba sobre si se creaba o no una landing aparte: sí se crea"
    - "El documento v1.2 pide reutilizar el Google reCAPTCHA de la plataforma y un aviso al usuario sobre el almacenamiento de sus datos. El aviso SÍ es de UX y ya está (texto debajo de Enviar). El reCAPTCHA NO es tema de este rol: va a existir, pero lo resuelve desarrollo — acá no se diseña ni se agrega al prototipo (2026-09-14)"
    - "El flujo funcional del documento v1.2 confirma decisiones ya tomadas en el prototipo: el acceso disponible para usuarios no logueados, el CTA 'Conocer más' en la tarjeta de Fulfillment, el flyer y el formulario en una misma pantalla, y los campos condicionales de rubro 'Otros' y número de cliente"
    - "Panel Beneficios de la v3 (pedido del usuario, 2026-09-14): el detalle de cada beneficio pasa de 13px regular a 14px medium, por legibilidad; el título ya estaba en 16px bold y no se tocó. Es una divergencia deliberada del diseño de Figma, que dibuja el detalle en 13px. El cambio subió el alto de la pantalla de 2200 a 2323px, así que se rehizo la captura del deck y el recorte del slide del formulario pasó de 54% a 52%"
    - "TIPOGRAFÍA RESUELTA (confirmado por el usuario, 2026-09-14): la pantalla de Fulfillment usa Gilroy, la tipografía del sistema. El diseño de Figma la dibuja con Poppins en el hero, los encabezados de columna y los beneficios, pero esa era una hipótesis sin confirmar y quedó descartada. Se cambió el token --ffv3-font-display y se retiró la carga de Google Fonts de index.html: el proyecto ya no depende de ningún recurso externo. El layout no cambió de alto (2200px), así que las capturas del deck siguen usando los mismos recortes"
  assumptions:
    - "El logo de Fulfillment de la tarjeta de servicios es provisorio: es un lockup tipográfico dibujado con la paleta de MiCorreo, hasta que el cliente entregue el asset oficial"
    - "No se crea una landing institucional paralela; sí una página de Fulfillment dentro de MiCorreo"
    - "v3: los seis servicios se modelan agrupados por columna, y no como una lista que se acomoda sola, para que en mobile cada encabezado quede con sus propios servicios"
  open_questions:
    - "Si los límites de longitud de 64 caracteres y el número de cliente de 10 dígitos exactos reemplazan a lo que dice el documento formal"
    - "Texto definitivo del mensaje de confirmación del formulario"
    - "Comportamiento ante error de envío real, cuando exista backend (el caso simulado sólo muestra la forma del error)"
    - "El guion y las capturas del deck de presentación (13 slides) todavía no fueron validados por el usuario"

